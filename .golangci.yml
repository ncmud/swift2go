version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # Quickfix suggestions; the rewritten boolean expressions in the parsers read worse.
        - -QF1001
        - -QF1003
        # Style checks on exported identifiers and comments.
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
    gosec:
      excludes:
        # The CLI runs swiftc/xcrun and reads the paths it is given; that is its job.
        - G204
        - G304
        # Generated output directories and files are meant to be world-readable.
        - G301
        - G306
        # swiftrt mirrors Swift's bit-pattern integer conversions on purpose.
        - G115
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
